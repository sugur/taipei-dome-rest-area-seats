<style>
:root{
  color-scheme:light;
  --bg:#f7f5f2; --panel:#ffffff; --ink:#2b2b2b; --muted:#6b6b6b; --line:#e6e1d8;
  --blue:#2f6fd6; --route:#ff7a00; --brown:#8a6d3b; --brown2:#c9a76a; --deep:#5a3e1b;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:14px}
.wrap>*{min-width:0}
header{text-align:center}
.header-top{display:flex;align-items:center;justify-content:center;gap:10px}
.header-logo{display:block;height:4.2rem;width:auto;flex:none}
.main-title{font-size:1.428rem;margin:0 0 6px;color:var(--brown);font-weight:800;line-height:1.3}
h1{font-size:.966rem;margin:0 0 4px;color:var(--muted);font-weight:600;line-height:1.3}
.search-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.04);display:grid;gap:8px}
.search-row{display:flex;gap:10px}
#idInput{flex:1;min-width:0;font-size:1.1rem;padding:12px 14px;border:1px solid var(--line);border-radius:10px;outline:none;background:var(--panel);color:var(--ink);font-family:var(--f-body)}
#idInput:focus{border-color:var(--brown2)}
#searchBtn{background:var(--brown);color:#fff;border:none;padding:12px 22px;border-radius:10px;font-size:1rem;font-weight:700;flex:none;cursor:pointer}
#searchBtn:hover{background:var(--brown2)}
.side{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.side label{display:grid;cursor:pointer}
.side input{position:absolute;opacity:0;pointer-events:none}
.side span{display:grid;place-items:center;min-width:56px;padding:0 12px;white-space:nowrap;font-weight:800;font-size:1.05rem;color:var(--muted);background:var(--panel)}
.side input:checked+span{background:var(--brown2);color:#fff}
.hint{font-size:.8rem;color:var(--muted)}
.err{color:#d23b3b;font-weight:700;font-size:.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.card[hidden]{display:none}
.seatno{font:900 1.7rem var(--f-mono);color:#d9480f;letter-spacing:.02em}
.seatno small{font:800 1.1rem var(--f-body);margin-right:2px}
.b{display:inline-block;border-radius:99px;padding:3px 12px;font-weight:700;font-size:.92rem;background:#f0ebe1;color:var(--deep)}
.b.zone{background:#0aa3e6;color:#fff;font-size:1.05rem}
.b.blue{background:#dbe6fb;color:#1d4fa3}.b.white{background:#fff6c2;color:#7a5c00;border:1px solid #e0b000}
.b.lead{background:#fde2e2;color:#c92a2a}
.more{font-size:.85rem;color:var(--muted)}
.more button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 10px;margin:2px;font:600 .85rem var(--f-mono);cursor:pointer}
.mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
.maphead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.maphead h2{margin:0;color:var(--deep);font-size:1.1rem}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.zones{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}
.zones button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 11px;font:700 .85rem var(--f-mono);cursor:pointer;color:var(--deep)}
.zones button.E{border-color:#9ad7f2}.zones button.W{border-color:#e7c48c}
.zones button:hover{background:#f0ebe1}
.stage{position:relative;height:min(78vh,860px);background:#efe9dd;overflow:hidden;touch-action:none;perspective:1400px}
.tilt{position:absolute;inset:0;transform-origin:50% 60%;transition:transform .6s ease}
.stage.d3 .tilt{transform:rotateX(46deg) scale(1.28) translateY(-4%)}
.stage.d3{background:linear-gradient(#d9e6ee,#efe9dd 38%)}
svg#m{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg#m.drag{cursor:grabbing}
.cad{opacity:.9;mix-blend-mode:multiply}
.seat ellipse{stroke-width:1.3}
.seat.w ellipse{fill:#fff6c2;stroke:#e0b000}
.seat.b ellipse{fill:#2f6fd6;stroke:#fff}
.seat text{font:700 6.6px var(--f-mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.seat.w text{fill:#3a2f00}.seat.b text{fill:#fff}
.seat.w.lead text{fill:#d0021b}.seat.b.lead text{fill:#ff2b2b;stroke:#fff;stroke-width:1.4px;paint-order:stroke}
.seat.me ellipse{fill:#ff7a00;stroke:#fff;stroke-width:2}
.seat.me text,.seat.me.lead text{fill:#fff;stroke:none}
.seat.me ellipse{animation:meblink 1s ease-in-out infinite}
@keyframes meblink{0%,100%{fill:#ff7a00;stroke:#fff}50%{fill:#ffe0b8;stroke:#ff7a00}}
.seat.me text{animation:metxt 1s ease-in-out infinite}
@keyframes metxt{0%,100%{fill:#fff}50%{fill:#b34700}}
.far .seat text{display:none}
.far .seat ellipse{stroke-width:0}
.seat{cursor:pointer}
.d3s .seat ellipse{filter:drop-shadow(0 2.5px 0 rgba(60,40,10,.45))}
.mk circle{fill:#ffd27a;stroke:#c98a1a;stroke-width:1.5}.mk text{font:800 11px var(--f-body);fill:#3a2a00;text-anchor:middle;dominant-baseline:central}.far .mk{display:none}.mk{pointer-events:none}
.zl{pointer-events:none}
.zl polygon{fill:#0aa3e6;stroke:#fff;stroke-width:4}
.zl.W polygon{fill:#f0a020}
.zl text{fill:#fff;font:900 34px var(--f-body);text-anchor:middle;dominant-baseline:central}
.zl .cnt{font:700 20px var(--f-body);fill:var(--deep);stroke:#fff;stroke-width:5;paint-order:stroke}
.near .zl:not(.gate){display:none}
.rt{fill:none;stroke:#13a34a;stroke-width:calc(14px * var(--s,1));stroke-dasharray:calc(44px * var(--s,1)) calc(26px * var(--s,1));stroke-linecap:round;stroke-linejoin:round;animation:dash 1.4s linear infinite}
.rtc{fill:none;stroke:#fff;stroke-width:calc(24px * var(--s,1));stroke-linecap:round;stroke-linejoin:round;opacity:.9}
@keyframes dash{to{stroke-dashoffset:-70}}
.oarea{fill:rgba(255,122,0,.16);stroke:#ff7a00;stroke-width:calc(7px * var(--s,1));stroke-linejoin:round}
.ocase{fill:none;stroke:#fff;stroke-width:calc(27px * var(--s,1));stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.oline{fill:none;stroke:#ff7a00;stroke-width:calc(16.2px * var(--s,1));stroke-linecap:round;stroke-linejoin:round}
.oflow{fill:none;stroke:#fff;stroke-width:calc(5.4px * var(--s,1));stroke-dasharray:calc(12px * var(--s,1)) calc(30px * var(--s,1));stroke-linecap:round;animation:dash 1.2s linear infinite}
.rhead{fill:#ff7a00;stroke:#fff;stroke-width:5;stroke-linejoin:round}
.gate circle{fill:#ff7a00;stroke:#fff;stroke-width:6}
.gate text{font:900 40px var(--f-body);fill:#d9480f;stroke:#fff;stroke-width:8;paint-order:stroke;text-anchor:middle}
.ring{fill:none;stroke:#ff7a00;stroke-width:5;animation:pulse 1.3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(2.2)}}
.tools{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:2}
.tools button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.95);font:800 1.1rem var(--f-body);color:var(--deep);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tools button.t{font-size:.8rem}
.tools button.me{background:#ff7a00;color:#fff;border-color:#ff7a00}.tools button.me:disabled{background:#fde0c4;border-color:#fde0c4;cursor:default}
.tools button.on{background:var(--brown2);color:#fff}
.tip{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:8px;padding:4px 10px;font-size:.78rem;color:var(--muted);z-index:2}
.foot{color:var(--muted);margin-top:12px;padding-bottom:20px;display:grid;gap:4px;font-size:.84rem}
.visitor-badge{opacity:.7;display:flex;align-items:center;gap:4px}
.visitor-badge img{height:22px}
html.embed body{padding:0;background:#fff}.embed .wrap{max-width:none;gap:0}.embed header,.embed .search-box,.embed .card,.embed .back,.embed .foot{display:none}.embed .mapwrap{border:0;border-radius:0}
.back{font-size:.85rem;text-align:center}.back a{color:var(--brown)}
@media (max-width:640px){
  body{padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-top:12px}
  .main-title{font-size:1.08rem}h1{font-size:.81rem}.header-logo{height:2.66rem}.header-top{gap:3px}
  .search-row{flex-wrap:wrap}#idInput{order:1;flex:1 1 calc(100% - 120px)}#searchBtn{order:2}.side{order:3}.side span{min-height:38px}
  .stage{height:72vh}
}
</style>
</head>

  svg.classList.toggle("far",k<1.15);const s=Math.max(1,.55/k);svg.style.setProperty("--s",Math.max(1,.32/k));if(AH){const s2=Math.max(1,.32/k);AH[0].setAttribute("transform",`translate(${AH[1]} ${AH[2]}) scale(${s2}) translate(${-AH[1]} ${-AH[2]})`)}for(const [g,x,y] of SC)g.setAttribute("transform",`translate(${x} ${y}) scale(${s}) translate(${-x} ${-y})`);svg.classList.toggle("near",k>=1.15);}
function scale(){const [sw,sh]=size();return Math.min(sw/V.w,sh/V.h)}
let anim=null;
function flyTo(T,ms=700){cancelAnimationFrame(anim);const S={...V},t0=performance.now();
  const step=t=>{let u=Math.min(1,(t-t0)/ms);u=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;for(const q of["x","y","w","h"])V[q]=S[q]+(T[q]-S[q])*u;render();if(u<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
function flyAt(g,ms){const [sw,sh]=size();const w=Math.max(190,sw/1.9),h=w*sh/sw;flyTo({x:g.x-w/2,y:g.y-h/2,w,h},ms||700)}
function fit(b,pad){const w=b[2]-b[0]+2*pad,h=b[3]-b[1]+2*pad;flyTo({x:b[0]-pad,y:b[1]-pad,w,h})}
function zoomAt(f,px,py){const [sw,sh]=size();const k=scale();const nw=Math.max(120,Math.min(W0*1.4,V.w*f)),nh=V.h*nw/V.w;
  const vx=V.x+(V.w-sw/k)/2,vy=V.y+(V.h-sh/k)/2;
  if(px==null||ang){px=sw/2;py=sh/2}
  const wx=vx+px/k,wy=vy+py/k;V.x=wx-(wx-V.x)*nw/V.w;V.y=wy-(wy-V.y)*nh/V.h;V.w=nw;V.h=nh;render()}
const tilt=()=>stage.classList.contains("d3")?Math.cos(46*Math.PI/180)*1.28:1;
// pointers
const P=new Map();let last=null,pinch=null,moved=0;
svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);moved=0;cancelAnimationFrame(anim);
  if(P.size===2){const [a,b]=[...P.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}else{last=[e.clientX,e.clientY];svg.classList.add("drag")}});
svg.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,[e.clientX,e.clientY]);
  if(P.size===2){const [a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch){const r=svg.getBoundingClientRect();zoomAt(pinch/d,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top)}pinch=d;moved=99;return}
  if(!last)return;let dx=e.clientX-last[0],dy=(e.clientY-last[1])/(stage.classList.contains("d3")?.69:1);last=[e.clientX,e.clientY];moved+=Math.abs(dx)+Math.abs(dy);
  const k=scale()*(stage.classList.contains("d3")?1.28:1),a=-ang*Math.PI/180;const rx=dx*Math.cos(a)-dy*Math.sin(a),ry=dx*Math.sin(a)+dy*Math.cos(a);V.x-=rx/k;V.y-=ry/k;render()});
const up=e=>{P.delete(e.pointerId);if(P.size<2)pinch=null;if(!P.size){last=null;svg.classList.remove("drag")}};
svg.addEventListener("pointerup",e=>{if(moved<6){const g=e.target.closest&&e.target.closest(".seat");if(g)select([g],false)}up(e)});
svg.addEventListener("pointercancel",up);
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.pow(1.0018,e.deltaY),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$("zin").onclick=()=>zoomAt(1/1.5);$("zout").onclick=()=>zoomAt(1.5);
$("rot").onclick=()=>{ang=(ang+90)%360;render()};
$("me").onclick=()=>{if(ME)flyAt(ME)};
$("all").onclick=()=>{ang=0;fit([150,1000,4880,5900],0)};
$("d3").onclick=()=>{const on=stage.classList.toggle("d3");$("d3").classList.toggle("on",on);svg.classList.toggle("d3s",on);$("d3").textContent=on?"平面":"立體"};
addEventListener("resize",render);
// search
function drawRoute(k){const G=$("orng");G.innerHTML="";$("routes").innerHTML="";const R=DATA.routes[k];if(!R)return;
  const ps=a=>a.map(q=>q.join(",")).join(" ");
  if(R.enter&&R.enter.length){const s=ps(R.enter);el("polyline",{points:s,class:"rtc"},$("routes"));el("polyline",{points:s,class:"rt"},$("routes"))}
  el("polygon",{points:ps(R.area),class:"oarea"},G);
  for(const c of["ocase","oline","oflow"])el("polyline",{points:ps(R.route),class:c},G);
  {const P=R.route,[x1,y1]=P[P.length-1];let i=P.length-2;while(i>0&&Math.hypot(P[i][0]-x1,P[i][1]-y1)<1)i--;const [x0,y0]=P[i],d=Math.hypot(x1-x0,y1-y0)||1,ux=(x1-x0)/d,uy=(y1-y0)/d,L=30,W=18,bx=x1-ux*L,by=y1-uy*L;
   const g=el("g",{},G);el("polygon",{class:"rhead",points:`${x1+ux*L*.35},${y1+uy*L*.35} ${bx-uy*W},${by+ux*W} ${bx+uy*W},${by-ux*W}`},g);AH=[g,x1,y1];render()}}
let ME=null,AH=null;
function select(gs,fly=true){ME=gs[0]._d;$("me").disabled=false;
  $("hl").innerHTML="";document.querySelectorAll(".seat.me").forEach(g=>g.classList.remove("me"));
  gs.forEach(g=>{g.classList.add("me");g.parentNode.appendChild(g);const d=g._d;el("circle",{cx:d.x,cy:d.y,r:22,class:"ring"},$("hl"))});
  drawRoute(gs[0]._d.k);
  const d=gs[0]._d,z=DATA.zones[d.k],coat=isBlue(d.id)?"藍衣":"白衣",side=d.k[0];
  let h=`<div class="seatno"><small>${z.ch}</small>${d.id}</div><span class="b zone">區域 ${z.name}</span><span class="b">入口 Gate 5</span><span class="b ${coat==="藍衣"?"blue":"white"}">${coat}</span>`;
  if(z.lead[d.id])h+=`<span class="b lead">進場排頭 ${z.lead[d.id]}</span>`;
  if(gs.length>1)h+=`<div class="more" style="width:100%">這個號碼出現在 ${gs.length} 個位置：${gs.map((g,i)=>`<button type="button" data-i="${i}">${DATA.zones[g._d.k].name}</button>`).join("")}</div>`;
  $("card").innerHTML=h;$("card").hidden=false;
  $("card").querySelectorAll(".more button").forEach(b=>b.onclick=()=>{const g=gs[+b.dataset.i]._d;flyAt(g)});
  if(fly){const g=gs[0]._d;flyAt(g,900);if(!document.documentElement.classList.contains("embed"))stage.scrollIntoView({behavior:"smooth",block:"center"})}
}
$("q").addEventListener("submit",e=>{e.preventDefault();$("err").textContent="";
  let v=$("idInput").value.trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[－—–_～~\s]+/g,"-");
  let side=document.querySelector("input[name=side]:checked").value;
  const m=v.match(/^(東|西)/);if(m){side=m[1]==="東"?"E":"W";document.querySelector(`input[name=side][value=${side}]`).checked=true}
  v=v.replace(/^(東二|西二|東|西)-?/,"");const n=v.match(/(\d+)\D+(\d+)/);
  if(!n){$("err").textContent="請輸入像 3-29 這樣的編號";return}
  const id=(+n[1])+"-"+(+n[2]);const gs=IDX[side][id];
  if(!gs){$("err").textContent=`${side==="E"?"東二":"西二"} 找不到 ${id}，請確認東二／西二是否選對`;return}
  select(gs);
});
const QS=new URLSearchParams(location.search),EMB=QS.get("embed")==="1";
if(EMB){const fitH=()=>{stage.style.height=Math.max(320,innerHeight-stage.getBoundingClientRect().top)+"px";render()};addEventListener("resize",fitH);requestAnimationFrame(fitH)}
function show(side,id,fly=true){const gs=IDX[side]&&IDX[side][id];if(gs)select(gs,fly);return !!gs}
addEventListener("message",e=>{const d=e.data||{};if(d.type==="seat")show(d.side,d.id)});
requestAnimationFrame(()=>{fit([150,1000,4880,5900],0);V={x:150,y:1000,w:4730,h:4900};render();
  if(QS.get("id")){const s=QS.get("s")||"E";setTimeout(()=>show(s,QS.get("id")),EMB?50:300)}});
</script>
