    const c=div("corr");c.textContent="廊道";put(c,F[1],11,F[2]);}
}

/* search */
function parse(){
  let raw=$("idInput").value.trim();
  if(/^西/.test(raw))$("sideW").checked=true; else if(/^東/.test(raw))$("sideE").checked=true;
  raw=raw.replace(/^[東西]二?/,"").replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248)).replace(/[－—–_\/\s]+/g,"-");
  let m=raw.match(/^(\d{1,2})-(\d{1,2})$/);if(m)return `${+m[1]}-${+m[2]}`;
  m=raw.match(/^\d{3,4}$/);if(m){const a=raw.length===3?1:2;return `${+raw.slice(0,a)}-${+raw.slice(a)}`}return null}
const ZONES={E:["E","E2","E3","E4","E5","E6","E7"],W:["W1","W2","W3","W4","W5","W6"]};
const zoneOf=(sd,id)=>ZONES[sd].find(z=>SIDES[z].byId[id]);
$("q").addEventListener("submit",e=>{e.preventDefault();
  const id=parse();const sd=$("sideW").checked?"W":"E";
  if(!id){$("err").hidden=false;$("err").textContent="請輸入身分證編號，格式像 3-29。";return}
  const z=zoneOf(sd,id);
  if(!z){$("err").hidden=false;$("err").textContent=`${sd==="E"?"東二":"西二"}${id} 不在${sd==="E"?"東二（E-1）":"西二（W-1～W-6）"}的資料裡。請確認東二／西二選擇和身分證編號，或洽現場人員。`;return}
  lookup(z,id)});
function fillList(sd){$("idList").innerHTML=ZONES[sd].flatMap(z=>SIDES[z].seats.map(s=>s.id)).sort((a,b)=>{const[x1,y1]=num(a),[x2,y2]=num(b);return x1-x2||y1-y2}).map(id=>`<option value="${id}">`).join("")}
document.querySelectorAll('input[name="side"]').forEach(r=>r.addEventListener("change",()=>{
  fillList($("sideW").checked?"W":"E")}));
function fromHash(){const h=decodeURIComponent(location.hash.slice(1));
  let m=h.match(/^([EW])(\d{1,2}-\d{1,2})$/);if(m){const z=zoneOf(m[1],m[2]);if(z)return [z,m[2]]}
  if(SIDES.E.byId[h])return ["E",h];return null}
setSide("E");
{const f=fromHash();if(f)lookup(f[0],f[1]);}
addEventListener("hashchange",()=>{const f=fromHash();if(f&&(!cur||cur.id!==f[1]||side!==f[0]))lookup(f[0],f[1])});
</script>
